name: sdxl_lora

# Relative paths are resolved from this config file's folder.
dataset: ../datasets/sdxl_encoded
model: /path/to/sdxl_base_model.safetensors
output: ../outputs

# Optional writable cache dir. If omitted, the CLI defaults to <output>/<name>/dataset_cache.
# dataset_cache_dir: ../outputs/sdxl_lora/dataset_cache

trigger_word: null
steps: 20000
batch_size: 1
gradient_accumulation: 2
lr: 0.0001
optimizer: adamw8bit
save_every: 1000
max_step_saves_to_keep: 15
save_best_model: true
sample_every: 1000
cache_latents: false

rank: 32
conv_rank: 16
resolution:
  - 512
  - 768
  - 1024
caption_ext: txt
cache_latents_to_disk: false
train_text_encoder: false
low_vram: false

dtype: bf16
vae_dtype: fp32
save_dtype: bf16   
save_format: safetensors

decode_images: true
decode_key: 123456789

sample_prompts:
  - 1girl, anime coloring, dress, sfw, posing, embarrassed, thighhighs
sample_neg: ""
sample_width: 1024
sample_height: 1024
sample_steps: 20
guidance_scale: 6.0
seed: 42
walk_seed: true
disable_sampling: true
no_skip_first_sample: true

# Optional:
# sample_prompts_file: ../temp/prompts.txt
# config_path: ../outputs/generated_job_config.json
# log: ../outputs/train.log
# write_config_only: true
