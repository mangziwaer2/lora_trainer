name: anima_lora

# Relative paths are resolved from this config file's folder.
# Minimum required changes for a new machine:
# 1. dataset
# 2. model
# 3. qwen3
# 4. vae
dataset: /kaggle/input/datasets/mangziwaer2/loradataset/lora_enc
model: /kaggle/input/models/mangziwaer2/abase/pytorch/default/1/BASBetterAnimeStylePlusAnima_baseV10.safetensors
qwen3: /kaggle/input/models/qwen-lm/qwen-3/transformers/0.6b-base/1/model.safetensors
vae: /kaggle/input/models/mangziwaer2/abase/pytorch/default/1/qwen_image_vae.safetensors
output: /kaggle/working/output

# Optional if your Anima base checkpoint does not already contain the LLM adapter.
# llm_adapter_path: /path/to/llm_adapter.safetensors

# Optional. If omitted, train_anima.py auto-detects ../vendor/sd-scripts first.
# sd_scripts_root: ../vendor/sd-scripts
# Optional. If omitted, this script uses the current Python environment.
# sd_scripts_python: ../.venv/Scripts/python.exe

# Same style as SDXL config where possible.
# For cloud 4090, prefer controlling total training by steps.
# Do not set both steps and max_train_epochs unless you intentionally want step-based control.
steps: 4000
batch_size: 1
gradient_accumulation: 4
lr: 0.0001
optimizer: AdamW8bit
save_every: 100

# Anima still uses dataset repeats, unlike the SDXL wrapper in this repo.
# This changes epoch length, not effective batch size.
num_repeats: 1

# LoRA rank. Alias of network_dim.
rank: 16

# Anima-specific training settings that usually do not need frequent changes.
resolution: 1024
caption_ext: txt
decode_images: true
decode_key: 123456789
allow_lossy_extensions: false

enable_bucket: true
bucket_reso_steps: 64
min_bucket_reso: 512
max_bucket_reso: 1664
bucket_no_upscale: false
flip_aug: false
shuffle_caption: false

dtype: bf16
save_format: safetensors
low_vram: false
gradient_checkpointing: true
cache_latents: true
cache_text_encoder_outputs: true

# Keep this enabled with cache_text_encoder_outputs to avoid text-side training conflicts.
network_train_unet_only: true

seed: 42
lr_scheduler: constant
timestep_sampling: sigmoid
discrete_flow_shift: 1.0

# Optional epoch-based control. Leave commented when using steps.
# max_train_epochs: 20
# save_every_n_epochs: 1

# Optional tuning knobs.
# network_alpha: 16
# vae_chunk_size: 64
# vae_disable_cache: true
# t5_tokenizer_path: ../vendor/sd-scripts/configs/t5_old

# Extra raw arguments appended to anima_train_network.py if needed.
# extra_args:
#   - --sample_every_n_steps
#   - "1000"

# Optional outputs/debug.
# decoded_dataset_dir: ../outputs/anima_lora/decoded_dataset
# command_path: ../outputs/anima_lora/anima_launch_command.json
# write_config_only: true
