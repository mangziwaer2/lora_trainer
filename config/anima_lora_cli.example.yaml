name: anima_aPV4

# Relative paths are resolved from this config file's folder.
# Minimum required changes for a new machine:
# 1. dataset
# 2. model
# 3. qwen3
# 4. vae
dataset: /root/autodl-tmp/trainer/lora_trainer/lora_enc
model: /root/autodl-tmp/trainer/lora_trainer/models/anima-base-v1.0.safetensors
qwen3: /root/autodl-tmp/trainer/lora_trainer/models/qwen3/model.safetensors
vae: /root/autodl-tmp/trainer/lora_trainer/models/qwen_image_vae.safetensors
output: /root/autodl-tmp/output-anima2

# Small-dataset preset:
# - bias toward stability over peak fit
# - intended for roughly tens of images, not hundreds
steps: 20000
batch_size: 4
gradient_accumulation: 5
lr: 2e-5
optimizer: AdamW8bit
save_every: 100
save_state: true
save_state_on_train_end: true
# Keep repeats low for tiny datasets to avoid overcooking early.
num_repeats: 5

# Lower rank is usually safer on very small datasets.
rank: 32
network_alpha: 32

resolution: 1024
caption_ext: txt
caption_dropout_rate: 0.1
decode_images: true
decode_key: 123456789
allow_lossy_extensions: false

enable_bucket: true
bucket_reso_steps: 64
min_bucket_reso: 512
max_bucket_reso: 1536
bucket_no_upscale: false
flip_aug: false
shuffle_caption: false

dtype: bf16
save_format: safetensors
low_vram: false
gradient_checkpointing: true
cache_latents: true
cache_text_encoder_outputs: true
network_train_unet_only: true

seed: 42
lr_scheduler: constant
timestep_sampling: sigmoid
discrete_flow_shift: 1.0
sigmoid_scale: 1.0
weighting_scheme: uniform

# Keep the adapter frozen unless you have a specific reason.
# llm_adapter_lr: 0.0

sample_every: 100
sample_prompts:
  - 1girl, anime coloring, park,dress,thighhighs,posing,sfw,
sample_neg: ""
sample_width: 1024
sample_height: 1536
sample_steps: 30
sample_seed: 42
guidance_scale: 4.0
walk_seed: false
sample_flow_shift: 3.0

# Optional validation:
# validation_split: 0.1
# validation_seed: 42
# validate_every_n_steps: 200
# max_validation_steps: 16

# Optional outputs/debug.
# command_path: ../outputs/anima_lora_small_dataset/anima_launch_command.json
# write_config_only: true
